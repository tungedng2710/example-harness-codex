[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-extraction"
version = "0.1.0"
description = "Offline synthetic invoice extraction teaching example"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "pydantic>=2,<3", "uvicorn"]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/document_extraction"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["experiments/starter", "experiments/overlays", ".tooling", ".tooling-packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
